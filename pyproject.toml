[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "domaindispute-scrapers"
version = "0.1.0"
description = "DomainDispute.com - scrapers, AI analysis, and data pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "supabase>=2.7.0,<2.10.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "tenacity>=8.5.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
# The scheduled workflow installs ".[dev]"; keep it empty so runs start fast.
dev = []
lint = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scrapers*"]
exclude = ["web*", "supabase*", "docs*", ".venv*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
